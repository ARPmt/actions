,10257341,5010,5011],[10281756,10281757,5011,5012],[10281799,10281800,5012,5013],[10281817,10281818,5013,5014],[10301406,10301407,5014,5015],[10333308,10333309,5015,5016],[10354351,10354352,5016,5017],[10405795,10405796,5017,5018],[10451533,10451534,5018,5019],[10451705,10451706,5019,5020],[10457940,10457941,5020,5021],[10457972,10457973,5021,5022],[10458421,10458422,5022,5023],[10458458,10458459,5023,5024],[10467908,10467909,5024,5025]]'
        run: |
          cat > /tmp/collect_movr.py <<'PYEOF'
          #!/usr/bin/env python3
          """movr (moonriver 1285) NG1 corpus collection from a GHA runner (Azure egress).
          Strategy: 1) sweep candidate RPC endpoints for availability+speed (with archive history checks)
          2) try trace_filter fast path  3) else bisection on eth_getTransactionCount prefix counts,
          4) fetch full block bodies, extract txs from NG1.  Prints MVR| lines + writes /tmp/movr_full.jsonl
          Never broadcasts / never writes chain state.
          """
          import json, time, os, sys, traceback
          import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed

          NG1 = "0x230a1ac45690b9ae1176389434610b9526d2f21b"
          NG1L = NG1.lower()
          LATEST = 10467909          # count(latest)==count(10467909)==5025 (fact335907)
          TOTAL = 5025
          GENESIS_BLOCK = 904512     # block holding nonce 0
          ROUNDS_CAP_SECS = 180
          FULL_CAP_SECS = 1800       # hard cap for all collection work
          OUTJSONL = '/tmp/movr_full.jsonl'
          STATE = '/tmp/movr_state.json'

          FRONTIER = json.loads(os.environ.get('FRONTIER_JSON') or '[]')

          CANDIDATES = [
              "https://moonriver.public.blastapi.io",
              "https://moonriver-mainnet.public.blastapi.io",
              "https://moonriver-rpc.publicnode.com",
              "https://moonriver.api.onfinality.io/public",
              "https://rpc.api.moonriver.moonbeam.network",
              "https://moonriver.unitedbloc.com",
              "https://moonriver.blockpi.network/v1/rpc/public",
              "https://moonriver.nodies.app",
              "https://moonriver.meowrpc.com",
              "https://moonriver.gateway.tenderly.co",
              "https://1285.rpc.thirdweb.com",
              "https://moonriver.rpc.subquery.network/public",
              "https://moonriver.therpc.io",
              "https://moonriver.public-rpc.com",
              "https://moonriver.drpc.org",
              "https://1rpc.io/movr",
              "https://moonriver.chainstacklabs.com",
              "https://moonriver.rpc.caldera.xyz/http",
              "https://moonriver.api.onfinality.io/ws".replace('/ws', '/public'),
          ]

          T0 = time.time()
          def el():
              return round(time.time() - T0, 1)

          def log(*a):
              print(f"[{el():7.1f}]", *a, flush=True)

          def rpc(ep, method, params, timeout=20, verify=True):
              t = time.time()
              try:
                  r = requests.post(ep, json={"jsonrpc": "2.0", "id": 1, "method": method, "params": params},
                                    timeout=timeout, verify=verify)
                  try:
                      j = r.json()
                  except Exception:
                      return {'ok': False, 'err': 'non-json http=%s %r' % (r.status_code, r.text[:150]),
                              'secs': round(time.time() - t, 2)}
                  return {'ok': 'result' in j, 'res': j.get('result'), 'err': j.get('error'),
                          'secs': round(time.time() - t, 2), 'http': r.status_code}
              except Exception as e:
                  return {'ok': False, 'err': repr(e)[:150], 'secs': round(time.time() - t, 2)}

          def rpc_batch(ep, calls, timeout=200):
              """calls: list of (method, params). returns (list_of_items_sorted_by_id, secs, err)"""
              payload = [{"jsonrpc": "2.0", "id": i, "method": m, "params": p} for i, (m, p) in enumerate(calls)]
              t = time.time()
              try:
                  r = requests.post(ep, json=payload, timeout=timeout)
              except Exception as e:
                  return None, round(time.time() - t, 2), repr(e)[:160]
              dt = round(time.time() - t, 2)
              try:
                  js = r.json()
              except Exception:
                  return None, dt, 'non-json http=%s %r' % (r.status_code, r.text[:160])
              if not isinstance(js, list):
                  return None, dt, 'not-list %r' % (str(js)[:160])
              by = {}
              for it in js:
                  if isinstance(it, dict) and 'id' in it:
                      by[it['id']] = it
              out = []
              for i in range(len(calls)):
                  out.append(by.get(i))
              return out, dt, None

          # ---------------- phase A: endpoint sweep ----------------
          def probe_ep(ep):
              d = {'ep': ep}
              r1 = rpc(ep, 'eth_chainId', [], timeout=12)
              d['chainId'] = r1.get('res') if r1['ok'] else r1.get('err')
              if not r1['ok'] or str(r1.get('res')).lower() not in ('0x505', '1285'):
                  d['verdict'] = 'BAD_CHAINID'
                  return d
              r2 = rpc(ep, 'eth_getTransactionCount', [NG1, 'latest'], timeout=15)
              d['latest_secs'] = r2['secs']
              d['latest'] = r2.get('res') if r2['ok'] else r2.get('err')
              r3 = rpc(ep, 'eth_getTransactionCount', [NG1, hex(964283)], timeout=20)
              d['hist_secs'] = r3['secs']
              d['hist'] = r3.get('res') if r3['ok'] else r3.get('err')
              r4 = rpc(ep, 'eth_getBlockByNumber', [hex(LATEST), False], timeout=25)
              d['blk_secs'] = r4['secs']
              d['blk_num'] = (r4.get('res') or {}).get('number') if r4['ok'] else r4.get('err')
              r5 = rpc(ep, 'trace_filter', [{"fromBlock": hex(964283), "toBlock": hex(964600), "fromAddress": [NG1]}], timeout=25)
              d['trace_secs'] = r5['secs']
              d['trace'] = ('list:%d' % len(r5['res'])) if r5['ok'] and isinstance(r5['res'], list) else str(r5.get('err'))[:120]
              good = (d.get('hist') == '0xdb') and d.get('blk_num') not in (None, '') and str(d.get('blk_num')).lower() == hex(LATEST)
              d['verdict'] = 'OK' if good else 'BAD_HIST_OR_BLOCK'
              return d

          def sweep():
              res = []
              with ThreadPoolExecutor(max_workers=9) as ex:
                  futs = {ex.submit(probe_ep, ep): ep for ep in CANDIDATES}
                  for fu in as_completed(futs):
                      try:
                          res.append(fu.result())
                      except Exception as e:
                          res.append({'ep': futs[fu], 'verdict': 'EXC', 'err': repr(e)[:120]})
              for d in res:
                  log('EP', json.dumps(d)[:400])
              oks = [d for d in res if d.get('verdict') == 'OK']
              oks.sort(key=lambda d: (d.get('hist_secs', 99) + d.get('blk_secs', 99)))
              return res, oks

          # ---------------- phase B: throughput ----------------
          def measure(ep):
              out = {}
              # pick real midpoint blocks from frontier segments
              mids = []
              for lo, hi, clo, chi in FRONTIER:
                  if hi - lo > 2:
                      mids.append((lo + hi) // 2)
              mids = sorted(set(mids))
              step = max(1, len(mids) // 100)
              sel = mids[::step][:100]
              for B in (25, 50, 100):
                  b = sel[:B]
                  calls = [('eth_getTransactionCount', [NG1, hex(x)]) for x in b]
                  items, dt, err = rpc_batch(ep, calls, timeout=240)
                  okn = sum(1 for it in (items or []) if it and 'result' in it)
                  out['b%d' % B] = {'secs': dt, 'ok': okn, 'n': len(b), 'err': err,
                                    'per_call_ms': round(1000 * dt / max(1, len(b)), 1)}
                  log('MEAS', json.dumps({'B': B, **out['b%d' % B]}))
                  if err or okn < len(b):
                      break
              # concurrency test: 4 x b50 in parallel
              b = sel[:50]
              calls = [('eth_getTransactionCount', [NG1, hex(x)]) for x in b]
              t = time.time()
              with ThreadPoolExecutor(max_workers=4) as ex:
                  futs = [ex.submit(rpc_batch, ep, calls, 240) for _ in range(4)]
                  okc = 0
                  for fu in as_completed(futs):
                      items, dt, err = fu.result()
                      okc += sum(1 for it in (items or []) if it and 'result' in it)
              out['par4_b50'] = {'secs': round(time.time() - t, 2), 'ok': okc, 'n': 200}
              log('MEAS', json.dumps(out['par4_b50']))
              return out

          # ---------------- count engine ----------------
          class Counter:
              def __init__(self, ep, batch=50, par=4):
                  self.ep = ep; self.batch = batch; self.par = par
                  self.queries = 0; self.http = 0; self.fails = 0
                  self.cache = {}

              def get_many(self, blocks):
                  need = [b for b in dict.fromkeys(blocks) if b not in self.cache]
                  if not need:
                      return {b: self.cache[b] for b in blocks if b in self.cache}
                  chunks = [need[i:i + self.batch] for i in range(0, len(need), self.batch)]
                  # one retry pass with halved batch
                  for attempt in (1, 2, 3):
                      if not chunks:
                          break
                      failed = []
                      with ThreadPoolExecutor(max_workers=self.par) as ex:
                          futs = {}
                          for ch in chunks:
                              calls = [('eth_getTransactionCount', [NG1, hex(b)]) for b in ch]
                              fut = ex.submit(rpc_batch, self.ep, calls, 300)
                              futs[fut] = ch
                          for fu in as_completed(futs):
                              ch = futs[fu]
                              items, dt, err = fu.result()
                              self.http += 1
                              self.queries += len(ch)
                              got = 0
                              if items:
                                  for b, it in zip(ch, items):
                                      if it and 'result' in it:
                                          try:
                                              self.cache[b] = int(it['result'], 16)
                                              got += 1
                                          except Exception:
                                              pass
                              if got < len(ch):
                                  failed.extend([b for b in ch if b not in self.cache])
                                  self.fails += 1
                                  log('CNT_FAIL', 'batch', len(ch), 'got', got, 'dt', dt, 'err', str(err)[:120])
                      if failed:
                          self.batch = max(5, self.batch // 2)
                          chunks = [failed[i:i + self.batch] for i in range(0, len(failed), self.batch)]
                          time.sleep(1)
                      else:
                          chunks = []
                  return {b: self.cache[b] for b in blocks if b in self.cache}

          def resolve_blocks(ep, deadline):
              """BFS bisection from FRONTIER -> list of (block, expected_count_in_block)"""
              counter = Counter(ep)
              resolved = []
              active = []
              for lo, hi, clo, chi in FRONTIER:
                  active.append([lo, hi, clo, chi])
              # known: block GENESIS_BLOCK holds nonce 0 (clo=1 at lo of first segment)
              resolved.append((GENESIS_BLOCK, 1))
              rnd = 0
              while active:
                  rnd += 1
                  nxt = []       # segments needing split
                  for seg in active:
                      lo, hi, clo, chi = seg
                      L = hi - lo; D = chi - clo
                      if D <= 0:
                          continue
                      if clo is None or chi is None:
                          nxt.append(seg); continue
                      if L == 1:
                          resolved.append((hi, D)); continue
                      if D == L:
                          for b in range(lo + 1, hi + 1):
                              resolved.append((b, 1))
                          continue
                      nxt.append(seg)
                  if not nxt:
                      break
                  # compute midpoints for all segments needing split
                  mids = {}
                  for lo, hi, clo, chi in nxt:
                      m = (lo + hi) // 2
                      mids[m] = None
                  got = counter.get_many(list(mids.keys()))
                  newact = []
                  stall = 0
                  for lo, hi, clo, chi in nxt:
                      if lo is None or hi is None:
                          continue
                      m = (lo + hi) // 2
                      cm = got.get(m)
                      if cm is None:
                          stall += 1
                          newact.append([lo, hi, clo, chi])
                          continue
                      # sanity: counts must be monotone within bounds
                      if (clo is not None and cm < clo) or (chi is not None and cm > chi):
                          log('WARN_NONMONO', lo, hi, clo, chi, m, cm)
                          newact.append([lo, hi, clo, chi]); continue
                      newact.append([lo, m, clo, cm])
                      newact.append([m, hi, cm, chi])
                  log('RND', rnd, 'segs_in', len(nxt), 'segs_out', len(newact), 'resolved', len(resolved),
                      'queries', counter.queries, 'http', counter.http, 'fails', counter.fails,
                      'elapsed', el())
                  active = [s for s in newact if not (s[0] is not None and s[1] is not None and s[3] - s[2] <= 0)]
                  if stall and stall == len(nxt):
                      log('STALL_ABORT', 'all midpoints failed')
                      break
                  if time.time() > deadline:
                      log('DEADLINE_IN_BISECT', 'remaining active segs', len(active))
                      return resolved, active, counter
              return resolved, [], counter

          def fetch_blocks(ep, pairs, deadline, batch=25, par=4):
              """pairs: list of (block, expected_k). returns list of tx dicts for NG1."""
              txs = []
              mismatch = []
              blocks = [p[0] for p in pairs]
              exp = dict(pairs)
              chunks = [blocks[i:i + batch] for i in range(0, len(blocks), batch)]
              done_blocks = 0
              with ThreadPoolExecutor(max_workers=par) as ex:
                  futs = {}
                  for ch in chunks:
                      calls = [('eth_getBlockByNumber', [hex(b), True]) for b in ch]
                      futs[ex.submit(rpc_batch, ep, calls, 300)] = ch
                  order = []
                  for fu in as_completed(futs):
                      ch = futs[fu]
                      items, dt, err = fu.result()
                      if not items:
                          log('BLK_FAIL', len(ch), str(err)[:120]); mismatch.append(('blockbatch', ch[:3], str(err)[:80])); continue
                      for b, it in zip(ch, items):
                          if not it or 'result' not in it or not it['result']:
                              mismatch.append((b, 'no block')); continue
                          blk = it['result']
                          found = []
                          for t in (blk.get('transactions') or []):
                              fr = (t.get('from') or '').lower()
                              if fr == NG1L:
                                  found.append(t)
                          if len(found) != exp.get(b, -1):
                              mismatch.append((b, 'expected %s got %d' % (exp.get(b), len(found))))
                          for t in found:
                              txs.append(extract_tx(t, int(blk['number'], 16), int(blk.get('timestamp', '0x0'), 16)))
                          done_blocks += 1
                      if done_blocks % 250 < batch:
                          log('BLKPROG', done_blocks, '/', len(blocks), 'txs', len(txs), 'elapsed', el())
                      if time.time() > deadline:
                          log('DEADLINE_IN_BLOCKS', done_blocks, '/', len(blocks))
                          break
              return txs, mismatch, done_blocks

          def extract_tx(t, block, ts):
              def h2i(x):
                  if x is None: return None
                  return int(x, 16) if isinstance(x, str) else int(x)
              cid = t.get('chainId')
              return {
                  'block': block, 'ts': ts, 'hash': t.get('hash'), 'nonce': h2i(t.get('nonce')),
                  'r': t.get('r'), 's': t.get('s'), 'v': t.get('v'), 'chainId': h2i(cid),
                  'type': t.get('type'), 'gasPrice': t.get('gasPrice'), 'maxFeePerGas': t.get('maxFeePerGas'),
                  'maxPriorityFeePerGas': t.get('maxPriorityFeePerGas'), 'gas': t.get('gas'),
                  'to': t.get('to'), 'value': t.get('value'), 'input': t.get('input'),
                  'from': t.get('from'),
              }

          def main():
              log('START egress', requests.get('https://api.ipify.org', timeout=10).text.strip() if True else '?')
              if len(FRONTIER) < 10:
                  log('FATAL no frontier'); return
              res, oks = sweep()
              json.dump(res, open('/tmp/ep_sweep.json', 'w'), indent=1)
              if not oks:
                  log('NO_ENDPOINT_OK'); return
              best = oks[0]['ep']
              log('BEST', best, json.dumps(oks[0])[:300])
              # canary on best endpoint: block 10467909 must hold nonce 5024, block 904512 nonce 0
              can = {}
              for b, want in ((LATEST, 5024), (GENESIS_BLOCK, 0)):
                  r = rpc(best, 'eth_getBlockByNumber', [hex(b), True], timeout=40)
                  blk = r.get('res') or {}
                  found = [t for t in (blk.get('transactions') or []) if (t.get('from') or '').lower() == NG1L]
                  can[str(b)] = {'n': len(found), 'nonces': [int(t['nonce'], 16) for t in found], 'secs': r['secs'], 'err': (r.get('err') or '')}
                  log('CANARY', b, json.dumps(can[str(b)])[:200])
              ok_canary = all((can[str(b)]['n'] >= 1 and want in can[str(b)]['nonces']) for b, want in ((LATEST, 5024), (GENESIS_BLOCK, 0)))
              log('CANARY_VERDICT', ok_canary)

              meas = measure(best)
              json.dump({'sweep': res, 'best': best, 'canary': can, 'canary_ok': ok_canary, 'meas': meas},
                        open('/tmp/movr_phase_ab.json', 'w'), indent=1)

              deadline_all = T0 + FULL_CAP_SECS
              # ---- fast path: trace_filter over full range
              txs = []
              mode = 'none'
              trace_supported = str(oks[0].get('trace', '')).startswith('list:')
              log('TRACE_SUPPORTED_ON_BEST', trace_supported, oks[0].get('trace'))
              tr = {'ok': False, 'res': None, 'err': 'skipped(not supported by probe)'}
              hashes = []
              if trace_supported:
                  tr = rpc(best, 'trace_filter', [{"fromBlock": hex(GENESIS_BLOCK), "toBlock": hex(LATEST), "fromAddress": [NG1]}], timeout=150)
                  log('TRACE_FULL secs', tr.get('secs'), 'ok', tr.get('ok'), 'n', (len(tr['res']) if isinstance(tr.get('res'), list) else None), 'err', str(tr.get('err'))[:150])
              if tr['ok'] and isinstance(tr['res'], list) and len(tr['res']) >= TOTAL * 0.9:
                  seen = set()
                  for trc in tr['res']:
                      if (trc.get('action') or {}).get('from', '').lower() == NG1L:
                          hh = (trc.get('transactionHash') or '').lower()
                          if hh and hh not in seen:
                              seen.add(hh); hashes.append(hh)
                  log('TRACE_FILTER hits', len(hashes), 'secs', tr['secs'])
                  # fetch tx bodies
                  got = []
                  for i in range(0, len(hashes), 50):
                      ch = hashes[i:i + 50]
                      calls = [('eth_getTransactionByHash', [h]) for h in ch]
                      items, dt, err = rpc_batch(best, calls, 300)
                      if items:
                          for it in items:
                              if it and it.get('result'):
                                  t = it['result']
                                  got.append(t)
                      if time.time() > deadline_all:
                          log('DEADLINE_IN_TXFETCH', len(got)); break
                      if i % 1000 == 0:
                          log('TXP', i, '/', len(hashes), 'got', len(got), 'elapsed', el())
                  # block numbers come from trace result
                  bh = {}
                  for trc in tr['res']:
                      hh = (trc.get('transactionHash') or '').lower()
                      if hh: bh[hh] = int(trc.get('blockNumber', '0x0'), 16)
                  for t in got:
                      hh = (t.get('hash') or '').lower()
                      txs.append(extract_tx(t, bh.get(hh, 0), 0))
                  mode = 'trace_filter'
              else:
                  log('TRACE_FILTER unavailable/insufficient', str(tr.get('err'))[:150], 'secs', tr['secs'])

              if not txs:
                  mode = 'bisect'
                  # allocate: bisect at most until 55% of remaining wall budget
                  dbg = time.time() + (deadline_all - time.time()) * 0.55
                  resolved, leftover, counter = resolve_blocks(best, dbg)
                  log('BISECT_DONE resolved_blocks', len(resolved), 'leftover_segs', len(leftover),
                      'queries', counter.queries, 'http', counter.http, 'fails', counter.fails)
                  json.dump({'resolved_n': len(resolved), 'leftover': leftover,
                             'queries': counter.queries, 'fails': counter.fails}, open('/tmp/bisect_state.json', 'w'))
                  txs, mismatch, done_blocks = fetch_blocks(best, resolved, deadline_all, batch=25, par=4)
                  log('BLOCKS_DONE', done_blocks, '/', len(resolved), 'txs', len(txs), 'mismatch', len(mismatch))
                  json.dump(mismatch[:200], open('/tmp/blk_mismatch.json', 'w'), indent=1)

              # dedupe by (chain,hash,nonce)
              seen = set(); uniq = []
              for t in txs:
                  k = (t.get('chainId'), (t.get('hash') or '').lower(), t.get('nonce'))
                  if k in seen: continue
                  seen.add(k); uniq.append(t)
              with open(OUTJSONL, 'w') as f:
                  for t in sorted(uniq, key=lambda x: (x.get('nonce') if x.get('nonce') is not None else -1)):
                      f.write(json.dumps(t, separators=(',', ':')) + '\n')
              nonces = sorted(t['nonce'] for t in uniq if t.get('nonce') is not None)
              miss = [n for n in range(TOTAL) if n not in set(nonces)]
              log('RESULT mode', mode, 'txs', len(uniq), 'distinct_hash', len({t['hash'] for t in uniq}),
                  'nonce_min', (nonces[0] if nonces else None), 'nonce_max', (nonces[-1] if nonces else None),
                  'missing_nonces', len(miss))
              log('MISSING_SAMPLE', miss[:40])
              for t in uniq:
                  print('MVR|%d|%s|%s|%s|%s|%s|%s|%s' % (t['block'], t['nonce'], t['hash'], t['r'], t['s'], t['v'],
                                                         t['chainId'], t['type']), flush=True)
              json.dump({'mode': mode, 'txs': len(uniq), 'distinct_hash': len({t['hash'] for t in uniq}),
                         'missing': miss[:200], 'missing_n': len(miss), 'elapsed': el()},
                        open(STATE, 'w'), indent=1)
              log('DONE', json.dumps(json.load(open(STATE)))[:400])

          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  traceback.print_exc()
                  log('FATAL_EXC')
          PYEOF
          python3 -u /tmp/collect_movr.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movr
          path: |
            /tmp/movr_full.jsonl
            /tmp/movr_state.json
            /tmp/ep_sweep.json
            /tmp/movr_phase_ab.json
            /tmp/blk_mismatch.json
            /tmp/bisect_state.json
          if-no-files-found: warn
