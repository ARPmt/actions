name: mm-ng1-collect
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "chunk limit (0 = full run)"
        required: false
        default: "0"
      chains:
        description: "comma list"
        required: false
        default: "moonriver,moonbeam"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: show python
        run: python3 -V && echo "runner ip:" && curl -sS -m 15 https://api.ipify.org; echo
      - name: collect
        env:
          MM_LIMIT: ${{ github.event.inputs.limit }}
          MM_CHAINS: ${{ github.event.inputs.chains }}
        run: |
          python3 scripts/mm_collect.py
