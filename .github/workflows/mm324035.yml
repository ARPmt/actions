name: mm324035
on:
  workflow_dispatch:
    inputs:
      chains:
        description: chains
        default: moonriver,moonbeam
        required: false
      offset:
        description: offset
        default: '10000'
        required: false
permissions:
  contents: read
jobs:
  moonscan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: moonscan-probe
        env:
          MM_CHAINS: ${{ github.event.inputs.chains }}
          MM_OFFSET: ${{ github.event.inputs.offset }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse, sys

          CH = [c for c in (os.environ.get('MM_CHAINS') or 'moonriver,moonbeam').split(',') if c]
          OFF = int(os.environ.get('MM_OFFSET') or '10000')
          NG1 = '0x230a1ac45690b9ae1176389434610b9526d2f21b'
          API = {
            'moonriver': 'https://api-moonriver.moonscan.io/api',
            'moonbeam':  'https://api-moonbeam.moonscan.io/api',
          }

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  return getattr(e, 'code', 0), (str(e).encode())

          outdir = 'mm_out'
          os.makedirs(outdir, exist_ok=True)
          for ch in CH:
              base = API.get(ch)
              if not base:
                  print('RL|%s|NO_ENDPOINT|0||' % ch, flush=True)
                  continue
              page = 1
              allrows = []
              while True:
                  q = urllib.parse.urlencode({'module':'account','action':'txlist','address':NG1,
                                              'startblock':0,'endblock':99999999,'sort':'asc',
                                              'offset':OFF,'page':page,'apikey':'YourApiKeyToken'})
                  url = base + '?' + q
                  st, body = get(url)
                  try:
                      j = json.loads(body)
                  except Exception:
                      j = None
                  if j is None:
                      print('RL|%s|page%d|HTTP=%d|nonjson|%s' % (ch, page, st, body[:200].decode('utf-8','replace')), flush=True)
                      break
                  status = str(j.get('status')); msg = str(j.get('message')); res = j.get('result')
                  n = len(res) if isinstance(res, list) else -1
                  print('RL|%s|page%d|HTTP=%d|status=%s|msg=%s|n=%d' % (ch, page, st, status, msg, n), flush=True)
                  if not isinstance(res, list):
                      print('RL|%s|RESULT_NOT_LIST|%s' % (ch, str(res)[:300]), flush=True)
                      break
                  if page == 1 and res:
                      keys = sorted(res[0].keys())
                      print('KEYS|%s|%s' % (ch, ','.join(keys)), flush=True)
                      print('SAMPLE|%s|%s' % (ch, json.dumps({k: res[0][k] for k in ('hash','nonce','from','to','value','txreceipt_status') if k in res[0]})), flush=True)
                  allrows.extend(res)
                  if len(res) < OFF:
                      break
                  page += 1
                  if page > 30:
                      print('RL|%s|PAGE_CAP|30' % ch, flush=True)
                      break
                  time.sleep(0.6)
              json.dump(allrows, open(os.path.join(outdir, 'txlist_%s.json' % ch), 'w'))
              sent = [t for t in allrows if str(t.get('from','')).lower() == NG1]
              recv = [t for t in allrows if str(t.get('from','')).lower() != NG1]
              hashes = []
              seen = set()
              for t in sent:
                  h = str(t.get('hash','')).lower()
                  if h and h not in seen:
                      seen.add(h); hashes.append(h)
              nonces = sorted(int(t.get('nonce')) for t in sent if str(t.get('nonce','')).isdigit())
              print('SENT|%s|all=%d|sent=%d|recv=%d|distinct_sent=%d|nonce_min=%s|nonce_max=%s' % (
                  ch, len(allrows), len(sent), len(recv), len(hashes),
                  nonces[0] if nonces else 'NA', nonces[-1] if nonces else 'NA'), flush=True)
              if hashes:
                  print('EDGE|%s|first=%s|last=%s' % (ch, hashes[0], hashes[-1]), flush=True)
              for h in hashes:
                  print('H|%s|%s' % (ch, h), flush=True)
          print('DONE_ALL', flush=True)
          PY
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm324035-out
          path: mm_out/
